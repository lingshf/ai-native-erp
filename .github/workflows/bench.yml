name: Bench

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: bench-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Check public npm registry
        if: steps.gate.outputs.run == 'true'
        run: node scripts/check-lockfile-registry.mjs
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: SQLite placeholder benchmark
        if: steps.gate.outputs.run == 'true'
        run: npm run bench
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: sqlite-placeholder-${{ github.run_id }}
          path: artifacts/ci/bench.*
          retention-days: 14
          if-no-files-found: error
