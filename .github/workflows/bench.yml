name: Bench

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate branch, tag or SHA (blank uses selected workflow ref)
        required: false
        type: string
      baseline:
        description: Optional baseline full commit SHA (blank disables relative comparison)
        required: false
        default: ""
        type: string
      sweep:
        description: Scan R=2/3/4 instead of only the production default
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # Full serial, concurrent and saturated-queue capacity evidence is manual/nightly only.
    # The PR workflow and its <=10 minute limit are intentionally unchanged.
    timeout-minutes: ${{ (inputs.baseline != '' || inputs.sweep == true) && 45 || 10 }}
    env:
      ERP_BENCH_BASELINE_SHA: ${{ inputs.baseline }}
      ERP_BENCH_SWEEP: ${{ inputs.sweep || false }}
    concurrency:
      group: bench-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Check public npm registry
        if: steps.gate.outputs.run == 'true'
        run: node scripts/check-lockfile-registry.mjs
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Check out requested baseline
        if: steps.gate.outputs.run == 'true' && inputs.baseline != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: .bench-baseline
          fetch-depth: 1
      - name: Install baseline dependencies
        if: steps.gate.outputs.run == 'true' && inputs.baseline != ''
        working-directory: .bench-baseline
        run: npm ci --no-audit --no-fund
      - name: Generate candidate fixture with candidate schema
        if: steps.gate.outputs.run == 'true'
        run: node packages/infra/bench/reports.ts prepare
        env:
          ERP_BENCH_FIXTURE: artifacts/ci/million.sqlite
      - name: Generate baseline fixture with baseline schema
        if: steps.gate.outputs.run == 'true' && inputs.baseline != ''
        run: node packages/infra/bench/reports.ts prepare
        env:
          ERP_BENCH_SOURCE_ROOT: .bench-baseline
          ERP_BENCH_FIXTURE: artifacts/ci/baseline-million.sqlite
      - name: Requested production child baseline (must run first)
        if: steps.gate.outputs.run == 'true' && inputs.baseline != ''
        run: node packages/infra/bench/reports.ts
        env:
          ERP_BENCH_MODE: baseline
          ERP_BENCH_SOURCE_ROOT: .bench-baseline
          ERP_BENCH_FIXTURE: artifacts/ci/baseline-million.sqlite
          ERP_BENCH_OUTPUT: artifacts/ci/baseline
      - name: Candidate SQLite benchmarks (production default R unless sweep requested)
        if: steps.gate.outputs.run == 'true'
        run: npm run bench
        env:
          ERP_BENCH_MODE: candidate
          ERP_BENCH_FIXTURE: artifacts/ci/million.sqlite
          ERP_BENCH_BASELINE_JSON: ${{ inputs.baseline != '' && 'artifacts/ci/baseline.json' || '' }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: sqlite-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/bench.*
            artifacts/ci/baseline.*
            artifacts/ci/million.sqlite.json
            artifacts/ci/baseline-million.sqlite.json
          retention-days: 14
          if-no-files-found: error

  trade-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bench-trade-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Install trade benchmark dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Production HTTP trade benchmark (three identical-load repetitions)
        if: steps.gate.outputs.run == 'true'
        run: node packages/infra/bench/trade-http.ts
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: trade-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/trade*.json
          retention-days: 14
          if-no-files-found: error

  migration-rehearsal:
    runs-on: ubuntu-latest
    # M2-05a: fictional 1M GL lines + 100k opening items; hard budgets are in the script.
    timeout-minutes: 30
    concurrency:
      group: bench-migration-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Install migration benchmark dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Migration chain benchmark (dry-run, import, confirm, backup + verify)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/bench-migration-rehearsal.mjs
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: migration-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/migration-rehearsal.json
          retention-days: 14
          if-no-files-found: error
