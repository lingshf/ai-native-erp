name: Full

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  full:
    name: full (${{ matrix.lane }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, browser]
        shard: [1, 2, 3, 4, 5, 6]
        # Unit and browser use 6 shards each. Browser (planned by measured weight): each part 2 of the
        # full keyboard trade GUI (zh/red, en/green), the business-event GUI, the page smoke and zh/red
        # part 1 get their own runner; migration GUI and en/green part 1 share the sixth.
    concurrency:
      group: full-${{ github.ref }}-${{ matrix.lane }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      CI_TEST_LAYER: full
      CI_TEST_LANE: ${{ matrix.lane }}
      ERP_E2E_BROWSER_CHANNEL: chrome
      ERP_E2E_ARTIFACTS: artifacts/ci/trade-e2e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Hosted runner disks are hydrated lazily; a cold Chrome install made single launches
      # take 8-16s. Reading the files into the page cache overlaps with setup-node and npm ci.
      - name: Prewarm Chrome disk cache in background
        if: matrix.lane == 'browser'
        continue-on-error: true
        run: nohup timeout 60 bash scripts/ci-prewarm-chrome.sh /tmp/chrome-prewarm.txt >/tmp/chrome-prewarm.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Check public npm registry
        if: steps.gate.outputs.run == 'true'
        run: node scripts/check-lockfile-registry.mjs
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Biome
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 1
        run: npm run check
      # Best effort only: the prewarm is never a gate. A failure (the script always writes a
      # status marker, even when killed) or a 20s wait limit is logged as a warning and the
      # tests run unchanged, with the complete Duration still reported.
      - name: Wait for Chrome disk prewarm (best effort, at most 20s)
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'browser'
        continue-on-error: true
        run: |
          start=$(date +%s%N)
          timeout 20 bash -c 'until [ -s /tmp/chrome-prewarm.txt ]; do sleep 0.2; done' || true
          waited="waited_ms=$((($(date +%s%N) - start) / 1000000))"
          result=$(cat /tmp/chrome-prewarm.txt 2>/dev/null || echo "status=timeout")
          echo "Chrome prewarm $result $waited"
          case "$result" in
            status=ok*) ;;
            *)
              echo "::warning title=Chrome prewarm::$result $waited; continuing with the tests"
              cat /tmp/chrome-prewarm.log 2>/dev/null || true
              ;;
          esac
      - name: Verify runner Chrome for real-browser slow tests
        if: steps.gate.outputs.run == 'true'
        run: google-chrome --version
      - name: Typecheck
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 1
        run: npm run typecheck
      - name: Import boundaries
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 2
        run: npm run check:boundaries
      - name: All tests including slow tests
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          if [ "${{ matrix.lane }}" = "browser" ]; then
            npm run test:ci -- --project=infra-browser --maxWorkers=1 --shard=${{ matrix.shard }}/6 2>&1 | tee artifacts/ci/vitest.log
          else
            npm run test:ci -- '--project=!infra-browser' --shard=${{ matrix.shard }}/6 2>&1 | tee artifacts/ci/vitest.log
          fi
      - name: Web build
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 2
        run: npm run build
      - name: Test timing summary
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/ci.ts summary
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: vitest-shard-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/vitest.json
            artifacts/ci/vitest.log
            artifacts/ci/gui-phases.json
          if-no-files-found: ignore
          retention-days: 14
      # GUI traces are written only by failing tests; screenshots and traces are uploaded only then.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.gate.outputs.run == 'true'
        with:
          name: trade-gui-shard-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/trade-e2e/
          if-no-files-found: ignore
          retention-days: 14
