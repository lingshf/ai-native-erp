name: Full

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  full:
    name: full (${{ matrix.lane }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, browser]
        shard: [1, 2, 3, 4, 5]
        exclude:
          - lane: unit
            shard: 5
    concurrency:
      group: full-${{ github.ref }}-${{ matrix.lane }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      CI_TEST_LAYER: full
      ERP_E2E_BROWSER_CHANNEL: chrome
      ERP_E2E_ARTIFACTS: artifacts/ci/trade-e2e
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check recent main activity
        id: gate
        run: node scripts/ci.ts gate
      - name: Check public npm registry
        if: steps.gate.outputs.run == 'true'
        run: node scripts/check-lockfile-registry.mjs
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Biome
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 1
        run: npm run check
      - name: Verify runner Chrome for real-browser slow tests
        if: steps.gate.outputs.run == 'true'
        run: google-chrome --version
      - name: Typecheck
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 1
        run: npm run typecheck
      - name: Import boundaries
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 2
        run: npm run check:boundaries
      - name: All tests including slow tests
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ matrix.lane }}" = "browser" ]; then
            npm run test:ci -- --project=infra-browser --maxWorkers=1 --shard=${{ matrix.shard }}/5
          else
            npm run test:ci -- '--project=!infra-browser' --shard=${{ matrix.shard }}/4
          fi
      - name: Web build
        if: steps.gate.outputs.run == 'true' && matrix.lane == 'unit' && matrix.shard == 2
        run: npm run build
      - name: Test timing summary
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/ci.ts summary
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: vitest-shard-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/vitest.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: trade-gui-shard-${{ matrix.lane }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/trade-e2e/
          if-no-files-found: ignore
          retention-days: 14
