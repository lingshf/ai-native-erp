name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check public npm registry
        run: node scripts/check-lockfile-registry.mjs
      - name: Verify npm metadata (temporary M0-06a evidence)
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const entries = Object.entries(lock.packages).filter(([name]) => name.startsWith("node_modules/@biomejs/"));
          assert.equal(entries.length, 11);
          await Promise.all(entries.map(async ([path, entry]) => {
            const name = path.slice("node_modules/".length);
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${entry.version}`);
            assert.ok(response.ok, `${name}: HTTP ${response.status}`);
            const metadata = await response.json();
            assert.equal(metadata.version, entry.version, `${name}: version`);
            assert.equal(metadata.dist.integrity, entry.integrity, `${name}: integrity`);
            assert.equal(metadata.dist.tarball, entry.resolved, `${name}: tarball`);
            console.log(`VERIFIED ${name}@${entry.version} ${entry.integrity}`);
          }));
          JS
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm run verify
