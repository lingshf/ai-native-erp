name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CI_TEST_LAYER: pr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Check public npm registry
        run: node scripts/check-lockfile-registry.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Biome
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Import boundaries
        run: npm run check:boundaries
      - name: Select tests
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci.ts plan
      - name: Affected tests
        id: tests
        env:
          ALL_TESTS: ${{ steps.scope.outputs.all }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$ALL_TESTS" = "true" ]; then
            npm run test:ci
          else
            npm run test:ci -- --changed "origin/$BASE_REF" --passWithNoTests
          fi
      - name: Web build
        run: npm run build
      - name: Test timing summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/ci.ts summary
