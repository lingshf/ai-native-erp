name: Legacy snapshot Windows

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handles:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ERP_WINDOWS_SNAPSHOT_HANDLES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Synthetic producer and real exclusive handles
        run: npx vitest run packages/infra/test/legacy-snapshot-producer.test.ts
      - name: Synthetic million-line snapshot benchmark
        run: node scripts/bench-legacy-snapshot.mjs
      - name: Fictional migration rehearsal from a real Windows snapshot (M2-05a J5)
        run: npx vitest run packages/infra/test/legacy-rehearsal.test.ts --maxWorkers=2
